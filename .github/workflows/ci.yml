name: CI - FinTrack API

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run lint

  tests:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Tests unitaires
        run: npm test
      - name: Tests d'intégration
        run: npm run test:integration

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --omit=dev # Seulement les dépendances de production
      - run: npm run build
      - name: Résumé
        run: |
          echo "## CI FinTrack API" >> $GITHUB_STEP_SUMMARY
          echo "Commit \`${{ github.sha }}\` : lint, tests et build OK" >> $GITHUB_STEP_SUMMARY